# cargo-deny configuration for Plinky workspace
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
yanked = "deny"
ignore = [
    # Upstream unmaintained notices for transitive Tauri & GTK dependencies
    "RUSTSEC-2024-0370", # proc-macro-error (glib-macros)
    "RUSTSEC-2017-0008", # serial (portable-pty)
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
    # zbus_names, zvariant and zvariant_derive were folded into zbus 6.
    # They come from zbus 5, which tauri-plugin-opener and
    # tauri-plugin-single-instance still require (^5.9, up to 2.7.2 and
    # 2.5.4 and the 3.0 alphas; checked 2026-10-22). Drop these three once
    # both plugins move to zbus 6.
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # Boost Software License 1.0: permissive, OSI-approved, GPL-compatible.
    # clipboard-win and error-code, arboard's Windows clipboard backend
    # (tauri-plugin-clipboard-manager, owner-approved).
    "BSL-1.0",
]
exceptions = []

[licenses.private]
ignore = true

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
